<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="valutaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#valutaBg)" stroke="#1e293b" stroke-width="8" />

  <!-- Subtle grid/circles in background -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#334155" stroke-width="2" opacity="0.3" />

  <!-- Outer Exchange Ring Glow -->
  <path d="M 160 210 A 110 110 0 0 1 360 210" fill="none" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round" />
  <polygon points="340,185 385,210 340,235" fill="#06b6d4" />

  <path d="M 352 302 A 110 110 0 0 1 152 302" fill="none" stroke="url(#indigoGrad)" stroke-width="22" stroke-linecap="round" />
  <polygon points="172,327 127,302 172,277" fill="#6366f1" />

  <!-- Center Currency Badge -->
  <circle cx="256" cy="256" r="64" fill="#0f172a" stroke="#334155" stroke-width="6" />
  
  <!-- Financial Currency Glyph (Intersection of Currency Symbol) -->
  <text x="256" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="-2">$</text>
  
  <!-- Modern Spark Accents -->
  <circle cx="360" cy="140" r="10" fill="#10b981" filter="url(#softGlow)" />
  <circle cx="150" cy="370" r="8" fill="#6366f1" filter="url(#softGlow)" />
</svg>
